[project]
name = "shopkart"
version = "1.0.0"
description = "Amazon-style ecommerce store — FastAPI backend + frontend"
requires-python = "==3.10.5"
dependencies = [
    "authlib>=1.8.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "jsonpatch>=1.33",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shopkart = "run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"run.py" = "run.py"

[dependency-groups]
dev = [
    "deepeval>=4.2.6",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end Ravi agent tests that call a live LLM",
]
